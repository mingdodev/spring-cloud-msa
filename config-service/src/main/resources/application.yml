server:
  port: 8888

spring:
  application:
    name: config-service
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
  profiles:
    active: git
  cloud:
    config:
      server:
        native:
          search-locations: file:${user.home}/Desktop/project/spring-cloud-config-native-file
        git:
          uri: https://github.com/mingdodev/spring-cloud-config
          default-label: main

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - busrefresh

encrypt:
  key: abcdefghijklmnopqrstuvwxyz1234567890
