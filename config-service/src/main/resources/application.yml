server:
  port: 8888

spring:
  application:
    name: config-service
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: file:///${user.home}/Desktop/project/spring-cloud-config-native-file
        git:
          uri: https://github.com/mingdodev/spring-cloud-config
          default-label: main
