server:
  port: 0

spring:
  application:
    name: user-service
  profiles:
    active: dev
  #  config:
#    import: "optional:configserver:http://localhost:8888"
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
      path: /h2-console
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update

#token:
#  expiration-time: 864000000 # 10 days
#  secret: my-very-long-secret-key-1234567890123456

logging:
  level:
    org.springframework.security: DEBUG

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka

greeting:
  message: Welcome to the Simple E-commerce. (Spring Boot)

management:
  endpoints:
    web:
      exposure:
        include:
          - refresh
          - health
          - beans
          - info